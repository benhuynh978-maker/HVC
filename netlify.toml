[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Ứng dụng dùng HashRouter (đường dẫn dạng /#/schedule) nên server không cần
# xử lý định tuyến — mọi request đều phục vụ index.html, phần sau dấu # do
# trình duyệt tự xử lý. Rule này chỉ để phòng hờ khi có ai truy cập thẳng
# một đường dẫn không phải "/".
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
